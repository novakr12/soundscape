services:
  app:
    image: node:25-slim
    working_dir: /app
    command: sh -c "npm install && npm run db:init && npm run db:deezer && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - .:/app:z
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    environment:
      DATABASE_URL: postgres://soundscape:${POSTGRES_PASSWORD:-soundscape}@postgres:5432/soundscape
      AUTH_SECRET: ${AUTH_SECRET:-soundscape-dev-secret-change-me}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      SIGNUPS: ${SIGNUPS:-open}
      ADMIN_USERS: ${ADMIN_USERS:-}
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: soundscape
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soundscape}
      POSTGRES_DB: soundscape
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "soundscape", "-d", "soundscape"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  app_node_modules:
  app_next:
  postgres_data:
